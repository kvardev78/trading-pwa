<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading App</title>

    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />

    <script src="https://s3.tradingview.com/tv.js"></script>
</head>

<body>

<header>
    <h1 id="header-title">Графика</h1>
</header>

<nav>
    <button data-tab="chart">Графика</button>
    <button data-tab="flow">Потоци</button>
    <button data-tab="journal">Журнал</button>
    <button data-tab="ai">AI Анализ</button>
    <button data-tab="signals">Сигнали</button>
    <button data-tab="models">Модели</button>
    <button data-tab="alerts">Аларми</button>
</nav>

<main>

    <!-- TAB: CHART -->
    <section id="tab-chart" class="tab active">
        <div id="tradingview_chart"></div>
    </section>

    <!-- TAB: FLOW -->
    <section id="tab-flow" class="tab">
        <div class="flow-panel">
            <div>CVD: <span id="cvd-value"></span></div>
            <div>Delta: <span id="delta-value"></span></div>
            <div>Volume Flow: <span id="volume-flow-value"></span></div>
            <div>Liquidity: <span id="liquidity-value"></span></div>
            <div>Funding: <span id="funding-value"></span></div>
            <div>Open Interest: <span id="oi-value"></span></div>
            <div>Liquidations: <span id="liq-value"></span></div>
            <div>Orderbook Heatmap: <span id="heatmap-value"></span></div>
        </div>
    </section>

    <!-- TAB: JOURNAL -->
    <section id="tab-journal" class="tab">
        <div class="journal-form">
            <input id="jr-date" type="date" />
            <input id="jr-time" type="time" />
            <select id="jr-direction">
                <option>Long</option>
                <option>Short</option>
            </select>
            <input id="jr-entry" placeholder="Вход" />
            <input id="jr-exit" placeholder="Изход" />
            <input id="jr-size" placeholder="Размер (ETH)" />
            <input id="jr-lev" placeholder="Ливъридж" />
            <textarea id="jr-notes" placeholder="Бележки"></textarea>
            <button id="jr-save">Запази</button>
        </div>

        <div id="journal-list"></div>
    </section>

    <!-- TAB: AI -->
    <section id="tab-ai" class="tab">
        <button id="generate-ai">Генерирай анализ</button>
        <div id="ai-output"></div>
    </section>

    <!-- TAB: SIGNALS -->
    <section id="tab-signals" class="tab">
        <div id="signals-output">Няма активни сигнали.</div>
    </section>
    <!-- TAB: MODELS -->
    <section id="tab-models" class="tab">
        <div id="models-output">Моделите се зареждат...</div>
    </section>

    <!-- TAB: ALERTS -->
    <section id="tab-alerts" class="tab">
        <div id="alerts-output">Няма активни аларми.</div>
    </section>
</main>

<script src="main.js"></script>
</body>
</html>
