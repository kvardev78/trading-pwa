<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading PWA</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>

<body>

  <!-- HEADER -->
  <header class="app-header">
    <h1 id="header-title">Графика</h1>
  </header>

  <!-- MAIN CONTENT -->
  <main id="content">

    <!-- TAB: CHART -->
    <section id="tab-chart" class="tab active">
      <div id="tradingview-widget"></div>
    </section>

    <!-- TAB: FLOW -->
    <section id="tab-flow" class="tab">
      <h2>Flow анализ</h2>
      <p class="placeholder">Тук ще бъдат CVD, Delta, Volume Flow, Liquidity.</p>
    </section>

    <!-- TAB: AI -->
    <section id="tab-ai" class="tab">
      <h2>AI Анализ</h2>
      <p class="placeholder">Тук ще бъде дневният AI анализ на ETH.</p>
    </section>

    <!-- TAB: JOURNAL -->
    <section id="tab-journal" class="tab">
      <h2>Търговски журнал</h2>
      <p class="placeholder">Тук ще записваш сделки.</p>
    </section>

    <!-- TAB: SETTINGS -->
    <section id="tab-settings" class="tab">
      <h2>Настройки</h2>
      <p class="placeholder">Тема, кеш, предпочитания.</p>
    </section>

  </main>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <button data-tab="chart">📈</button>
    <button data-tab="flow">💧</button>
    <button data-tab="ai">🤖</button>
    <button data-tab="journal">📝</button>
    <button data-tab="settings">⚙️</button>
  </nav>

  <script src="main.js"></script>
</body>
</html>
