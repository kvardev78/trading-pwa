<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading PWA</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>

<body>

  <header class="app-header"></header>
   <main id="content">

    <section id="tab-chart" class="tab active">
      <div id="tradingview_chart"></div>
    </section>

    <section id="tab-flow" class="tab">
   <h2>Flow анализ</h2>

<div class="flow-box">
  <h3>CVD</h3>
  <p id="cvd-value">Очаква данни...</p>
</div>

<div class="flow-box">
  <h3>Delta</h3>
  <p id="delta-value">Очаква данни...</p>
</div>

<div class="flow-box">
  <h3>Volume Flow</h3>
  <p id="volume-flow-value">Очаква данни...</p>
</div>

<div class="flow-box">
  <h3>Liquidity Zones</h3>
  <p id="liquidity-value">Очаква данни...</p>
</div>
    </section>

    <section id="tab-ai" class="tab">
      <h2>AI Анализ</h2>
      <p class="placeholder">Тук ще бъде дневният AI анализ на ETH.</p>
    </section>

    <section id="tab-journal" class="tab">
     <h2>Търговски журнал</h2>

<div class="journal-box">
  <div class="jr-row">
    <div>
      <label>Дата</label>
      <input id="jr-date" type="date">
    </div>

    <div>
      <label>Час</label>
      <input id="jr-time" type="time">
    </div>
  </div>

  <div class="jr-row">
    <div>
      <label>Посока</label>
      <select id="jr-direction">
        <option value="">--</option>
        <option value="Long">Long</option>
        <option value="Short">Short</option>
      </select>
    </div>

    <div>
      <label>Ливъридж</label>
      <input id="jr-lev" type="number" step="1">
    </div>
  </div>

  <div class="jr-row">
    <div>
      <label>Входна цена</label>
      <input id="jr-entry" type="number" step="0.01">
    </div>

    <div>
      <label>Изходна цена</label>
      <input id="jr-exit" type="number" step="0.01">
    </div>
  </div>

  <div class="jr-row">
    <div>
      <label>Размер (ETH)</label>
      <input id="jr-size" type="number" step="0.001">
    </div>
  </div>

  <label>Бележки</label>
  <textarea id="jr-notes" rows="3"></textarea>

  <button id="jr-save" class="journal-button">Запази сделката</button>
</div>

<div id="journal-list"></div>

    </section>

    <section id="tab-settings" class="tab">
      <h2>Настройки</h2>
      <p class="placeholder">Тема, кеш, предпочитания.</p>
    </section>

  </main>

  <nav class="bottom-nav">
    <button data-tab="chart">📈</button>
    <button data-tab="flow">💧</button>
    <button data-tab="ai">🤖</button>
    <button data-tab="journal">📝</button>
    <button data-tab="settings">⚙️</button>
  </nav>

  <script src="https://s3.tradingview.com/tv.js"></script>
  <script src="main.js"></script>

</body>
</html>
