<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading App</title>

    <!-- TradingView -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
<div id="app">

    <header class="app-header">
        <h1>Trading App</h1>
    </header>

    <main class="app-main">

        <!-- TAB: CHART -->
        <section id="tab-chart" class="tab active">
            <div id="chart-container"></div>
        </section>

        <!-- TAB: FLOW -->
        <section id="tab-flow" class="tab">

            <h2>Money Flow & Liquidity</h2>

            <div class="flow-box">
                <h3>Обем и посока</h3>
                <div id="flow-volume"></div>
            </div>

            <div class="flow-box">
                <h3>Open Interest</h3>
                <div id="flow-oi"></div>
            </div>

            <div class="flow-box">
                <h3>Funding / Sentiment</h3>
                <div id="flow-funding"></div>
            </div>

            <div class="flow-box">
                <h3>Резюме</h3>
                <div id="flow-summary"></div>
            </div>

            <div class="flow-box">
                <h3>Delta / CVD</h3>
                <div id="flow-delta"></div>
                <div id="flow-cvd"></div>
                <canvas id="cvd-chart" width="300" height="80"></canvas>
            </div>

            <div class="flow-box">
                <h3>Ликвидации</h3>
                <div id="flow-liquidations"></div>
            </div>

            <div class="flow-box">
                <h3>Orderbook Heatmap</h3>
                <div id="flow-heatmap"></div>
            </div>

        </section>

        <!-- TAB: AI -->
        <section id="tab-ai" class="tab">
            <h2>AI Анализ</h2>
            <p>Тук ще има AI сценарии, bias, входове/изходи, риск и вероятности.</p>
        </section>

        <!-- TAB: JOURNAL -->
        <section id="tab-journal" class="tab">
            <h2>Journal & Risk</h2>
            <p>Тук ще има дневник, чеклист, риск мениджмънт и статистика.</p>
        </section>

    </main>

    <!-- Navigation -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-target="tab-chart">Chart</button>
        <button class="nav-btn" data-target="tab-flow">Flow</button>
        <button class="nav-btn" data-target="tab-ai">AI</button>
        <button class="nav-btn" data-target="tab-journal">Journal</button>
    </nav>

</div>

<script src="main.js"></script>
</body>
</html>
