<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading App</title>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>
<div id="app">

    <header class="app-header">
        <h1>Trading App</h1>
    </header>

    <main class="app-main">

        <!-- TAB: CHART -->
        <section id="tab-chart" class="tab active">
            <div id="chart-container"></div>
        </section>

        <!-- TAB: FLOW -->
        <section id="tab-flow" class="tab">

            <h2>Money Flow & Liquidity</h2>

            <div class="flow-box">
                <h3>Обем и посока</h3>
                <div id="flow-volume"></div>
            </div>

            <div class="flow-box">
                <h3>Open Interest</h3>
                <div id="flow-oi"></div>
            </div>

            <div class="flow-box">
                <h3>Funding / Sentiment</h3>
                <div id="flow-funding"></div>
            </div>

            <div class="flow-box">
                <h3>Резюме</h3>
                <div id="flow-summary"></div>
            </div>

            <div class="flow-box">
                <h3>Delta / CVD</h3>
                <div id="flow-delta"></div>
                <div id="flow-cvd"></div>
                <canvas id="cvd-chart" width="300" height="80"></canvas>
            </div>

            <div class="flow-box">
                <h3>Ликвидации</h3>
                <div id="flow-liquidations"></div>
