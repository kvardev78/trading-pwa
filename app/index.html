<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Trading App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">

    <!-- TradingView скрипт -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
    <div id="app">
        <header class="app-header">
            <h1>Trading App</h1>
        </header>

        <main class="app-main">
            <!-- TAB: CHART -->
            <section id="tab-chart" class="tab active">
                <div id="chart-container"></div>
            </section>

            <!-- TAB: FLOW -->
            <section id="tab-flow" class="tab">
             <h2>Money Flow & Liquidity (ETHUSDT)</h2>

<div class="flow-grid">
  <div class="flow-box">
    <h3>Обем и посока</h3>
    <div id="flow-volume"></div>
  </div>

  <div class="flow-box">
    <h3>Open Interest</h3>
    <div id="flow-oi"></div>
  </div>

  <div class="flow-box">
    <h3>Funding / Sentiment</h3>
    <div id="flow-funding"></div>
  </div>

  <div class="flow-box">
    <h3>Резюме</h3>
    <div id="flow-summary"></div>
  </div>

  <div class="flow-box">
  <h3>Delta / CVD</h3>
  <div id="flow-delta"></div>
  <div id="flow-cvd"></div>
  </div>
            </section>

            <!-- TAB: AI -->
            <section id="tab-ai" class="tab">
                <h2>AI Анализ</h2>
                <p>Тук ще има AI сценарии, bias, входове/изходи, риск и вероятности.</p>
            </section>

            <!-- TAB: JOURNAL -->
            <section id="tab-journal" class="tab">
                <h2>Journal & Risk</h2>
                <p>Тук ще има дневник, чеклист, риск мениджмънт и статистика.</p>
            </section>
        </main>

        <nav class="bottom-nav">
            <button class="nav-btn active" data-target="tab-chart">Chart</button>
            <button class="nav-btn" data-target="tab-flow">Flow</button>
            <button class="nav-btn" data-target="tab-ai">AI</button>
            <button class="nav-btn" data-target="tab-journal">Journal</button>
        </nav>
    </div>

        <script src="main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            async function loadOrderflow(symbol) {
  try {
    const res = await fetch(`https://api.bybit.com/v5/market/recent-trade?category=linear&symbol=${symbol}&limit=1000`);
    const json = await res.json();

    if (!json.result || !json.result.list) return;

    let buyVol = 0;
    let sellVol = 0;

    json.result.list.forEach(t => {
      const qty = Number(t.qty);
      if (t.side === "Buy") buyVol += qty;
      else sellVol += qty;
    });

    const delta = buyVol - sellVol;

    // CVD per symbol
    const cvdKey = `cvd_${symbol}`;
    const prevCvd = Number(localStorage.getItem(cvdKey)) || 0;
    const newCvd = prevCvd + delta;
    localStorage.setItem(cvdKey, newCvd);

    document.getElementById("flow-delta").innerText =
      `Delta (real): ${delta.toFixed(2)}`;

    document.getElementById("flow-cvd").innerText =
      `CVD: ${newCvd.toFixed(2)}`;

  } catch (err) {
    console.log("Orderflow error:", err);
  }
}
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(err => {
                        console.log('SW registration failed:', err);
                    });
            });
        }
    </script>
</body>
</html>
